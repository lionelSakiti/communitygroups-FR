name: Demande concernant les organisateurs d'un chapitre
description: Ce formulaire permet de demander l'ajout ou le retrait d'un organisateur d'un groupe CNCG existant sur community.cncf.io.
title: "[Organizer Request] Add or Remove Organizer Name"
body:
- type: markdown
  attributes:
    value: |
      Si vous souhaitez devenir organisateur, l'équipe CNCF mentionnera les organisateurs actuels du groupe pour qu'ils examinent et commentent votre demande.
      
      Si vous demandez le retrait d'un organisateur, remplissez les champs ci-dessous pour formaliser la démission.
- id: chapter
  type: input
  attributes:
    label: Nom du chapitre concerné
    placeholder: "Ex. : Cloud Native San Francisco"
  validations:
    required: true
- id: organizer
  type: textarea
  attributes:
    label: Présentez-vous : nom, adresse email, entreprise, URL GitHub, URL LinkedIn, identifiant Slack CNCF (ou besoin d'une invitation) et lien obligatoire vers votre profil community.cncf.io
    placeholder: "Ex. : Audra Montenegro, CNCF, https://github.com/AudMonte01, https://www.linkedin.com/in/audramontenegro/, Audra Montenegro in CNCF Slack, https://community.cncf.io/u/m8bqcv/#/about"
  validations:
    required: true
- id: organizer_2
  type: textarea
  attributes:
    label: Expliquez pourquoi vous souhaitez rejoindre ou quitter ce chapitre
    placeholder: "Ex. : Je souhaite rejoindre le chapitre comme coorganisateur et apporter mon expérience à la communauté"
  validations:
    required: false
- type: markdown
  attributes:
    value: |
       ### Si vous demandez à devenir organisateur, prenez connaissance des conditions suivantes et acceptez-les :
- id: organizer_coc
  type: checkboxes
  attributes:
    label: Code de conduite
    description: "Le Code de conduite contribue à créer un environnement sûr pour tous. Chaque personne doit l'accepter."
    options:
      - label: J'accepte de respecter le [Code de conduite CNCF](https://github.com/cncf/foundation/blob/main/code-of-conduct.md)
        required: false
- id: organizer_residency
  type: checkboxes
  attributes:
    label: Lieu de résidence de l'organisateur
    description: "Tout nouvel organisateur CNCG doit résider à temps plein dans la zone où se trouve le chapitre concerné."
    options:
      - label: Je confirme résider dans la ville du chapitre proposé ou à proximité (ne pas cocher si cette condition ne concerne pas la demande)
        required: false
- id: organizer_affiliation
  type: checkboxes
  attributes:
    label: Entreprises et affiliations des organisateurs
    description: "Les organisateurs CNCG ne peuvent pas tous appartenir à la même entreprise."
    options:
      - label: Je travaille dans une entreprise différente de celle des organisateurs actuels (ne pas cocher si sans objet)
        required: false
- id: organizer_inclusivity
  type: checkboxes
  attributes:
    label: Inclusion
    description: "Vous acceptez d'accueillir toutes les personnes souhaitant découvrir le cloud native, quel que soit leur niveau en open source."
    options:
      - label: J'accepte. Pour cela, j'ai récemment suivi la formation [Inclusive Open Source Community Orientation (LFC102)](https://training.linuxfoundation.org/training/inclusive-open-source-community-orientation-lfc102/) (ne pas cocher si sans objet). J'ajouterai dans un commentaire le lien vers mon badge Credly attestant de cette formation.
        required: false
- id: organizer_inclusivity_badge
  type: input
  attributes:
    label: Lien vers votre badge Credly LFC102
    placeholder: "Ex. : https://www.credly.com/badges/..."
    description: "Collez le lien vers votre badge Credly attestant de la réussite de la formation LFC102."
  validations:
    required: false
- id: organizer_neutrality
  type: checkboxes
  attributes:
    label: Neutralité vis-à-vis des fournisseurs
    description: "Le contenu principal des meetups CNCG doit rester neutre vis-à-vis des fournisseurs. Notez que [les sponsors peuvent disposer de 15 minutes de parole au maximum](https://github.com/cncf/communitygroups/blob/main/best_practices.md#sponsorships)"
    options:
      - label: J'ai pris connaissance de ce que [signifie la neutralité vis-à-vis des fournisseurs](https://contribute.cncf.io/maintainers/community/vendor-neutrality/), et j'accepte que le contenu principal des meetups reste neutre vis-à-vis des fournisseurs (ne pas cocher si sans objet)
        required: false
- id: organizer_activity
  type: checkboxes
  attributes:
    label: Maintenir un chapitre actif
    description: "Vous comprenez et acceptez d'organiser un meetup, un groupe d'étude ou un événement virtuel [au moins une fois tous les 90 jours (par trimestre)](https://github.com/cncf/communitygroups/blob/main/README.md#community-group-inactivity). En cas de retard prévisible, vous informerez l'équipe CNCF à community-groups@cncf.io"
    options:
      - label: Je comprends les exigences d'activité des chapitres CNCF (ne pas cocher si sans objet)
        required: false
- id: organizer_collaboration
  type: checkboxes
  attributes:
    label: Collaboration avec d'autres chapitres
    description: "La CNCF peut approuver d'autres chapitres dans votre zone si celle-ci est suffisamment peuplée."
    options:
      - label: Je reconnais le droit de la CNCF d'approuver d'autres chapitres dans ma zone selon ce critère (ne pas cocher si sans objet)
        required: false
- id: organizer_diversity
  type: checkboxes
  attributes:
    label: Favoriser la diversité des intervenants lors des meetups
    description: "La diversité varie selon les pays. L'objectif commun est de promouvoir la participation des femmes et des personnes ne s'identifiant pas comme hommes parmi les intervenants."
    options:
      - label: Je ferai de mon mieux pour accueillir des intervenants diversifiés tout au long de l'année (ne pas cocher si sans objet)
        required: false
- type: markdown
  attributes:
    value: |
     #### L'examen et l'approbation d'une demande pour devenir organisateur peuvent prendre jusqu'à 30 jours afin de laisser aux organisateurs actuels le temps d'en discuter. Tous les échanges se déroulent dans l'issue GitHub. Posez vos questions dans ses commentaires.
     
     #### Le délai de traitement d'une démission peut varier. Assignez @AudMonte01 à l'issue pour accélérer son traitement.
