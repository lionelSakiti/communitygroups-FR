name: Demande de création d'un groupe communautaire Cloud Native (CNCG)
description: Demander la création d'un nouveau groupe communautaire Cloud Native dans votre ville
title: "[Group Request] Create a new group"
body:
- type: markdown
  attributes:
    value: |
      ### À lire avant de commencer :
      
      :loudspeaker: Avant de remplir ce formulaire, consultez [community.cncf.io](https://community.cncf.io) pour vérifier qu'aucun groupe actif n'existe dans votre zone. Si un groupe existe, nous recommandons de collaborer avec ses organisateurs. Vous pouvez également [ouvrir une demande pour devenir organisateur](https://github.com/cncf/communitygroups/issues/new?assignees=&labels=&projects=&template=organizer-request.yml&title=%5BOrganizer+Request%5D+Add+or+Remove+Organizer+Name). :loudspeaker:

      Consultez également toutes les [issues ouvertes](https://github.com/cncf/communitygroups/issues) pour vérifier qu'une demande similaire n'est pas déjà en cours. Si c'est le cas, indiquez dans un commentaire votre intérêt pour la coorganisation.
      
      Si ces vérifications ne révèlent aucun groupe actif ni demande en cours, remplissez ce formulaire pour permettre à notre équipe d'examiner votre candidature.
- type: input
  id: name
  attributes:
    label: Nom de la ville ou du lieu de votre CNCG
    description: "Si votre groupe a été désactivé récemment, ne remplissez pas ce formulaire : contactez plutôt community-groups@cncf.io."
    placeholder: "Ex. : Cloud Native San Francisco"
  validations:
    required: true
- id: location
  type: input
  attributes:
    label: Dans quel pays souhaitez-vous créer votre groupe communautaire ?
    placeholder: "Ex. : Bénin"
  validations:
    required: true
- id: organizer_1
  type: textarea
  attributes:
    label: Présentez-vous : nom, email, entreprise, URL GitHub, URL LinkedIn, identifiant Slack CNCF (ou besoin d'invitation) et lien obligatoire vers votre profil community.cncf.io
    placeholder: "Ex. : Audra Montenegro, CNCF, https://github.com/AudMonte01, https://www.linkedin.com/in/audramontenegro/, Audra Montenegro in CNCF Slack, https://community.cncf.io/u/m8bqcv/#/about"
  validations:
    required: true
- id: organizer_inclusivity
  type: checkboxes
  attributes:
    label: Inclusion
    description: "Vous vous engagez à accueillir toutes les personnes souhaitant découvrir le cloud native, quel que soit leur niveau d'expérience en open source."
    options:
      - label: J'accepte/Nous acceptons. Pour cela, j'ai/nous avons récemment suivi la formation [Inclusive Open Source Community Orientation (LFC102)](https://training.linuxfoundation.org/training/inclusive-open-source-community-orientation-lfc102/)
        required: true
- id: organizer_inclusivity_badge_1
  type: input
  attributes:
    label: Lien vers votre badge Credly LFC102
    placeholder: "Ex. : https://www.credly.com/badges/..."
    description: "Collez le lien vers votre badge Credly attestant de la réussite de la formation LFC102."
  validations:
    required: true
- id: organizer_2
  type: textarea
  attributes:
    label: Présentez votre coorganisateur : nom, email, entreprise, URL GitHub, URL LinkedIn, identifiant Slack CNCF (ou besoin d'invitation) et lien obligatoire vers son profil community.cncf.io
    placeholder: "Ex. : Audra Montenegro, CNCF, https://github.com/AudMonte01, https://www.linkedin.com/in/audramontenegro/, Audra Montenegro in CNCF Slack, https://community.cncf.io/u/m8bqcv/#/about"
  validations:
    required: false
- id: organizer_inclusivity_badge_2
  type: input
  attributes:
    label: Lien vers le badge Credly LFC102 de votre coorganisateur
    placeholder: "Ex. : https://www.credly.com/badges/..."
    description: "Collez le lien vers votre badge Credly attestant de la réussite de la formation LFC102."
  validations:
    required: false
- id: organizer_3
  type: textarea
  attributes:
    label: Présentez votre coorganisateur : nom, email, entreprise, URL GitHub, URL LinkedIn, identifiant Slack CNCF (ou besoin d'invitation) et lien obligatoire vers son profil community.cncf.io
    placeholder: "Ex. : Audra Montenegro, CNCF, https://github.com/AudMonte01, https://www.linkedin.com/in/audramontenegro/, Audra Montenegro in CNCF Slack, https://community.cncf.io/u/m8bqcv/#/about"
  validations:
    required: false
- id: organizer_inclusivity_badge_3
  type: input
  attributes:
    label: Lien vers le badge Credly LFC102 de votre coorganisateur
    placeholder: "Ex. : https://www.credly.com/badges/..."
    description: "Collez le lien vers votre badge Credly attestant de la réussite de la formation LFC102."
  validations:
    required: false
- id: meetupDOTcom
  type: textarea
  attributes:
    label: Si vous organisez déjà un meetup, indiquez son lien ici
    placeholder: "Ex. : https://www.meetup.com/bay-area-kubernetes-meetup/"
  validations:
    required: false
- id: content
  type: textarea
  attributes:
    label: Quelle est la mission ou l'objectif de ce nouveau groupe ?
    placeholder: "Ex. : Nous nous intéressons aux microservices, aux conteneurs, à leurs distributions et aux solutions permettant de les déployer, de les gérer et de les étendre. Tous les niveaux sont les bienvenus ; nous souhaitons créer un environnement ouvert et accueillant pour les passionnés de Kubernetes."
  validations:
    required: true
- id: organizer_coc
  type: checkboxes
  attributes:
    label: Code de conduite
    description: "Le Code de conduite contribue à créer un environnement sûr pour tous. Toutes les personnes, y compris les futurs intervenants et coorganisateurs, doivent l'accepter."
    options:
      - label: J'accepte/Nous acceptons de respecter le [Code de conduite CNCF](https://github.com/cncf/foundation/blob/main/code-of-conduct.md)
        required: true
- id: organizer_residency
  type: checkboxes
  attributes:
    label: Lieu de résidence des organisateurs
    description: "Tous les organisateurs CNCG doivent résider à temps plein dans la zone où ils souhaitent créer leur groupe."
    options:
      - label: Je confirme/Nous confirmons résider dans la ville du groupe proposé ou à proximité.
        required: true
- id: organizer_affiliation
  type: checkboxes
  attributes:
    label: Entreprises et affiliations des organisateurs
    description: "Les organisateurs CNCG ne peuvent pas tous appartenir à la même entreprise."
    options:
      - label: J'accepte/Nous acceptons que, dès lors qu'il y a plusieurs organisateurs, la majorité provienne d'entreprises différentes.
        required: true
- id: organizer_neutrality
  type: checkboxes
  attributes:
    label: Neutralité vis-à-vis des fournisseurs
    description: "Le contenu principal des meetups CNCG doit rester neutre vis-à-vis des fournisseurs. Notez que [les sponsors peuvent disposer de 15 minutes de parole au maximum](https://github.com/cncf/communitygroups/blob/main/best_practices.md#sponsorships)."
    options:
      - label: J'ai/Nous avons pris connaissance de ce que [signifie la neutralité vis-à-vis des fournisseurs](https://contribute.cncf.io/maintainers/community/vendor-neutrality/) et acceptons que le contenu principal de nos meetups reste neutre vis-à-vis des fournisseurs.
        required: true
- id: organizer_branding
  type: checkboxes
  attributes:
    label: Accepter d'utiliser l'identité visuelle CNCG
    description: "Afin d'éviter toute utilisation abusive des marques et de préserver l'identité commune du programme CNCG, vous acceptez d'utiliser [l'identité visuelle CNCG](https://github.com/cncf/artwork/blob/main/examples/other.md#cloud-native-community-groups) (see also [branding.md](https://github.com/cncf/communitygroups/blob/main/branding.md) pour les règles de dénomination et les autres ressources graphiques)."
    options:
      - label: J'accepte/Nous acceptons d'utiliser le logo CNCG pour le groupe et ses réseaux sociaux.
        required: true
- id: organizer_registration
  type: checkboxes
  attributes:
    label: Inscriptions sur les plateformes CNCF
    description: "Pour que votre groupe bénéficie de l'accompagnement prévu, les inscriptions aux meetups doivent passer par les plateformes CNCF ou la plateforme communautaire CNCF en vigueur."
    options:
      - label: J'accepte/Nous acceptons de proposer des inscriptions gratuites sur la plateforme principale de la CNCF.
        required: true
- id: organizer_activity
  type: checkboxes
  attributes:
    label: Maintenir un groupe actif
    description: "Vous acceptez d'organiser un meetup, un groupe d'étude ou un événement virtuel [au moins une fois tous les 90 jours (par trimestre)](https://github.com/cncf/communitygroups/blob/main/README.md#community-group-inactivity). En cas de retard prévisible, vous informerez l'équipe CNCF à community-groups@cncf.io."
    options:
      - label: J'accepte/Nous acceptons d'organiser un meetup au moins tous les 90 jours, ou de communiquer les raisons d'une éventuelle période d'inactivité.
        required: true
- id: organizer_collaboration
  type: checkboxes
  attributes:
    label: Collaboration avec d'autres groupes
    description: "La CNCF peut approuver d'autres groupes dans votre zone si celle-ci est suffisamment peuplée."
    options:
      - label: Je reconnais/Nous reconnaissons le droit de la CNCF d'approuver d'autres groupes dans notre zone selon ce critère.
        required: true
- id: organizer_diversity
  type: checkboxes
  attributes:
    label: Favoriser la diversité des intervenants lors des meetups
    description: "La diversité varie selon les pays. L'objectif commun est de promouvoir la participation des femmes et des personnes ne s'identifiant pas comme hommes parmi les intervenants."
    options:
      - label: Je ferai/Nous ferons de notre mieux pour accueillir des intervenants diversifiés tout au long de l'année.
        required: true
- type: markdown
  attributes:
    value: |
      ### Délai d'examen

      L'examen de votre demande peut prendre jusqu'à 30 jours, le temps de procéder aux vérifications nécessaires. Pour toute question, commentez votre issue GitHub.
