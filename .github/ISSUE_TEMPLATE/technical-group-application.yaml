name: Demande de création d'un groupe communautaire technique
description: Demander la création d'un groupe communautaire Cloud Native consacré à un sujet technique
title: "[TCG Request] <Group Topic>"
labels:
  - kind/tech-community-group
body:
- type: markdown
  attributes:
    value: |
      ### À lire avant de commencer :
      
      :loudspeaker: Avant de remplir ce formulaire, consultez [community.cncf.io](https://community.cncf.io) pour vérifier qu'aucun groupe communautaire technique actif ne traite déjà de ce sujet. 
      
      L'examen de votre demande peut prendre jusqu'à 30 jours, le temps de procéder aux vérifications nécessaires. Pour toute question, ajoutez un commentaire à votre issue GitHub.

- type: input
  id: name
  attributes:
    label: Sujet de ce groupe communautaire technique
    placeholder: "Ex. : TCG Platform Engineering"
  validations:
    required: true
- id: content
  type: textarea
  attributes:
    label: Quelle est la mission ou l'objectif de ce nouveau groupe ?
    placeholder: "Ex. : Nous nous intéressons aux microservices, aux conteneurs, à leurs distributions et aux solutions permettant de les déployer, les gérer et les étendre. Tous les niveaux sont les bienvenus. Nous souhaitons créer un environnement ouvert et accueillant pour les passionnés de Kubernetes."
  validations:
    required: true
- id: organizer_1
  type: textarea
  attributes:
    label: Présentez-vous : nom, email, entreprise, URL GitHub, URL LinkedIn, identifiant Slack CNCF (ou besoin d'invitation) et lien obligatoire vers votre profil community.cncf.io
    placeholder: "Ex. : Audra Montenegro, CNCF, https://github.com/AudMonte01, https://www.linkedin.com/in/audramontenegro/, Audra Montenegro in CNCF Slack, https://community.cncf.io/u/m8bqcv/#/about"
  validations:
    required: true
- id: organizer_2
  type: textarea
  attributes:
    label: Présentez vos coorganisateurs avec les mêmes informations que pour vous-même, ou indiquez l'issue GitHub du dépôt TOC dans laquelle ce point a été traité.
    placeholder: "Ex. : Audra Montenegro, CNCF, https://github.com/AudMonte01, https://www.linkedin.com/in/audramontenegro/, Audra Montenegro in CNCF Slack, https://community.cncf.io/u/m8bqcv/#/about"
  validations:
    required: false
- id: organizer_3
  type: textarea
  attributes:
    label: Présentez vos coorganisateurs avec les mêmes informations que pour vous-même, ou indiquez l'issue GitHub du dépôt TOC dans laquelle ce point a été traité.
    placeholder: "Ex. : Audra Montenegro, CNCF, https://github.com/AudMonte01, https://www.linkedin.com/in/audramontenegro/, Audra Montenegro in CNCF Slack, https://community.cncf.io/u/m8bqcv/#/about"
  validations:
    required: false
- id: organizer_coc
  type: checkboxes
  attributes:
    label: Code de conduite
    description: "Le Code de conduite contribue à créer un environnement sûr pour tous. Toutes les personnes, y compris les futurs intervenants et coorganisateurs, doivent l'accepter."
    options:
      - label: Nous acceptons de respecter le [Code de conduite CNCF](https://github.com/cncf/foundation/blob/main/code-of-conduct.md)
        required: true
- id: organizer_affiliation
  type: checkboxes
  attributes:
    label: Affiliation des organisateurs
    description: "La majorité des organisateurs du groupe ne peut pas appartenir à la même entreprise."
    options:
      - label: Je confirme, au nom de tous les organisateurs, que la moitié au maximum appartient à la même organisation.
        required: true
- id: organizer_inclusivity
  type: checkboxes
  attributes:
    label: Inclusion
    description: "Vous vous engagez à accueillir toutes les personnes souhaitant apprendre le cloud native, quel que soit leur niveau d'expérience en open source."
    options:
      - label: Nous acceptons. À cette fin, tous les organisateurs ont récemment suivi la formation [Inclusive Open Source Community Orientation (LFC102)](https://training.linuxfoundation.org/training/inclusive-open-source-community-orientation-lfc102/)
        required: true
- id: organizer_neutrality
  type: checkboxes
  attributes:
    label: Neutralité vis-à-vis des fournisseurs
    description: "La majeure partie des meetups doit être neutre vis-à-vis des fournisseurs. Notez que [les sponsors peuvent disposer de 15 minutes de prise de parole au maximum](https://github.com/cncf/communitygroups/blob/main/best_practices.md#sponsorships)"
    options:
      - label: Nous avons pris connaissance de ce que [signifie la neutralité vis-à-vis des fournisseurs](https://contribute.cncf.io/maintainers/community/vendor-neutrality/), et acceptons que le contenu principal de nos meetups reste neutre vis-à-vis des fournisseurs
        required: true
- id: organizer_diversity
  type: checkboxes
  attributes:
    label: Favoriser la diversité des intervenants lors des rencontres.
    description: "La diversité prend des formes différentes selon les pays. L'objectif commun est de promouvoir la participation des femmes et des personnes ne s'identifiant pas comme hommes parmi les intervenants."
    options:
      - label: Nous ferons de notre mieux pour accueillir des intervenants diversifiés tout au long de l'année
        required: true
- type: markdown
  attributes:
    value: |
      ### L'examen de votre demande peut prendre jusqu'à 30 jours. Pour toute question pendant cette période, commentez votre issue GitHub.
