name: Vérifier les chapitres à proximité

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  check-nearby-chapters:
    # Exécution à l'ouverture d'une issue [Group Request], ou lorsqu'une personne écrit
    # « /recheck » dans un commentaire (nouvel essai manuel après une erreur temporaire de l'API).
    # Les commentaires créés avec le GITHUB_TOKEN par défaut ne relancent pas les workflows,
    # les instructions du robot ne peuvent donc pas créer de boucle.
    if: >
      (github.event_name == 'issues' &&
       contains(github.event.issue.title, '[Group Request]')) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       contains(github.event.issue.title, '[Group Request]') &&
       startsWith(github.event.comment.body, '/recheck'))
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests geopy

      - name: Vérifier les chapitres voisins
        id: check-chapters
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python .github/workflows/scripts/check_nearby_chapters.py

      - name: Commenter l'issue
        uses: actions/github-script@v7
        env:
          STATUS: ${{ steps.check-chapters.outputs.status }}
          NEARBY_CHAPTERS: ${{ steps.check-chapters.outputs.nearby_chapters }}
          EVENT_NAME: ${{ github.event_name }}
        with:
          script: |
            const status = process.env.STATUS;
            const nearbyChapters = process.env.NEARBY_CHAPTERS;
            // Un commentaire /recheck constitue une demande explicite : répondre même
            // sans résultat. À l'ouverture d'une issue, ne rien publier si aucun chapitre n'est trouvé.
            const isRecheck = process.env.EVENT_NAME === 'issue_comment';

            let body = null;
            if (status === 'found') {
              body = `## ⚠️ Chapitres à proximité détectés\n\n` +
                `Nous avons trouvé des chapitres CNCF Community Group près du lieu demandé :\n\n` +
                nearbyChapters + `\n\n` +
                `Examinez ces chapitres existants. S'ils se trouvent dans votre zone, nous recommandons :\n` +
                `- Contacter les organisateurs actuels pour collaborer\n` +
                `- Déposer une [demande pour devenir organisateur](https://github.com/cncf/communitygroups/issues/new?assignees=&labels=&projects=&template=organizer-request.yml&title=%5BOrganizer+Request%5D+Add+or+Remove+Organizer+Name) pour rejoindre l'équipe comme coorganisateur\n\n` +
                `Si ces chapitres ne sont pas dans votre zone immédiate et que vous estimez que la population permet de créer un autre chapitre, précisez votre situation dans cette issue.`;
            } else if (status === 'error') {
              body = `## ⚠️ Impossible de vérifier les chapitres à proximité\n\n` +
                `Le répertoire des chapitres CNCF est temporairement inaccessible. La vérification n'a pas pu aboutir.\n\n` +
                `Commentez \`/recheck\` dans cette issue pour relancer la vérification.`;
            } else if (status === 'none' && isRecheck) {
              body = `## ✅ Aucun chapitre voisin trouvé\n\n` +
                `Après une nouvelle vérification, aucun chapitre CNCF Community Group existant n'a été trouvé près du lieu demandé.`;
            }

            if (body) {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body
              });
            }
